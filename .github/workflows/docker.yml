name: Build and Push Docker
on:
  release:
    types:
      - created
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Github Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_GITHUB_PAT }}

      # Builds all the images in a single BuildKit session so that the stages
      # they share are only built once. Tags and caches are defined in the bake
      # file: pushes to main get the 'latest' tags, releases get the
      # release-specific ones.
      - name: Build images (${{ matrix.arch }})
        uses: docker/bake-action@3acf805d94d93a86cce4ca44798a76464a75b88c # v6.9.0
        env:
          ARCH: ${{ matrix.arch }}
          RELEASE: ${{ github.event_name == 'release' && github.event.release.name || '' }}
          SERVER_VERSION: ${{ github.event_name == 'release' && github.event.release.name || 'nightly' }}
        with:
          source: .
          files: docker/docker-bake.hcl
          push: true

  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: karakeep-web
            tags_latest: ghcr.io/hoarder-app/hoarder-web:latest,ghcr.io/karakeep-app/karakeep-web:latest
            tags_release: ghcr.io/hoarder-app/hoarder-web:${{ github.event.release.name }},ghcr.io/karakeep-app/karakeep-web:${{ github.event.release.name }},ghcr.io/hoarder-app/hoarder-web:release,ghcr.io/karakeep-app/karakeep-web:release
          - name: karakeep-workers
            tags_latest: ghcr.io/hoarder-app/hoarder-workers:latest,ghcr.io/karakeep-app/karakeep-workers:latest
            tags_release: ghcr.io/hoarder-app/hoarder-workers:${{ github.event.release.name }},ghcr.io/karakeep-app/karakeep-workers:${{ github.event.release.name }},ghcr.io/hoarder-app/hoarder-workers:release,ghcr.io/karakeep-app/karakeep-workers:release
          - name: karakeep-cli
            tags_latest: ghcr.io/hoarder-app/hoarder-cli:latest,ghcr.io/karakeep-app/karakeep-cli:latest
            tags_release: ghcr.io/hoarder-app/hoarder-cli:${{ github.event.release.name }},ghcr.io/karakeep-app/karakeep-cli:${{ github.event.release.name }},ghcr.io/hoarder-app/hoarder-cli:release,ghcr.io/karakeep-app/karakeep-cli:release
          - name: karakeep-mcp
            tags_latest: ghcr.io/karakeep-app/karakeep-mcp:latest
            tags_release: ghcr.io/karakeep-app/karakeep-mcp:${{ github.event.release.name }},ghcr.io/karakeep-app/karakeep-mcp:release
          - name: karakeep-aio
            tags_latest: ghcr.io/hoarder-app/hoarder:latest,ghcr.io/karakeep-app/karakeep:latest
            tags_release: ghcr.io/hoarder-app/hoarder:${{ github.event.release.name }},ghcr.io/karakeep-app/karakeep:${{ github.event.release.name }},ghcr.io/hoarder-app/hoarder:release,ghcr.io/karakeep-app/karakeep:release
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Github Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_GITHUB_PAT }}

      - name: Create manifests for ${{ matrix.name }}
        env:
          TAGS_LATEST: ${{ matrix.tags_latest }}
          TAGS_RELEASE: ${{ matrix.tags_release }}
          IS_RELEASE: ${{ github.event_name == 'release' }}
          IS_PUSH: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail

          create_manifest() {
            local tag="$1"
            docker buildx imagetools create \
              -t "${tag}" \
              "${tag}-amd64" \
              "${tag}-arm64"
          }

          # Only create 'latest' manifests on pushes to main
          if [[ "${IS_PUSH}" == "true" ]]; then
            IFS=',' read -ra latest_tags <<< "${TAGS_LATEST}"
            for tag in "${latest_tags[@]}"; do
              create_manifest "$tag"
            done
          fi

          # Only create release-specific manifests on releases
          if [[ "${IS_RELEASE}" == "true" ]]; then
            IFS=',' read -ra release_tags <<< "${TAGS_RELEASE}"
            for tag in "${release_tags[@]}"; do
              create_manifest "$tag"
            done
          fi
