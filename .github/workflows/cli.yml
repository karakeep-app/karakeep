name: Publish CLI Package to npm
on:
  push:
    tags:
      - "cli/v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup
        uses: ./tooling/github/setup

      - name: Set canary version
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version "0.0.0-canary.${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT}" --no-git-tag-version
        working-directory: apps/cli

      - name: Build CLI
        run: pnpm build
        working-directory: apps/cli

      # npm 11.5.1 or later is required for trusted publishing. Node 24 has
      # bundled it since v24.5.0, so check the version instead of installing
      # npm@latest right before publishing.
      - name: Check npm version
        run: |
          npm_version="$(npm -v)"
          if ! printf '11.5.1\n%s\n' "$npm_version" | sort -V -C; then
            echo "npm >= 11.5.1 is required for trusted publishing, found $npm_version" >&2
            exit 1
          fi

      - name: Publish stable release
        if: github.event_name == 'push'
        run: pnpm publish --access public --no-git-checks
        working-directory: apps/cli

      - name: Publish canary release
        if: github.event_name == 'workflow_dispatch'
        run: pnpm publish --access public --no-git-checks --tag canary
        working-directory: apps/cli
