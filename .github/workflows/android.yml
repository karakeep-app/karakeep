name: Android App Release Build

on:
  push:
    tags:
      - 'android/v[0-9]+.[0-9]+.[0-9]+-[0-9]+'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup repo
        uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Set up JDK 17
        uses: actions/setup-java@v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
        with:
          packages: 'platform-tools'

      - name: Setup Expo
        uses: expo/expo-github-action@8.2.1
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android app
        working-directory: apps/mobile
        run: eas build --platform android --local --output ${{ github.workspace }}/app-release.aab
        env:
          EAS_SKIP_AUTO_FINGERPRINT: "1"
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY: ${{ secrets.EXPO_PUBLIC_REVENUECAT_ANDROID_API_KEY }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4.6.2
        with:
          name: karakeep-android
          path: ${{ github.workspace }}/app-release.aab
