name: Chrome Image

on:
  pull_request:
    paths:
      - ".github/workflows/chrome.yml"
      - "docker/chrome/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/chrome.yml"
      - "docker/chrome/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  IMAGE: ghcr.io/karakeep-app/karakeep-chrome
  # Google Chrome version (amd64); arm64 images use Debian's Chromium.
  GOOGLE_CHROME_VERSION: 157.0.8103.38
  IMAGE_REVISION: r1

jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.created.outputs.value }}
    permissions:
      contents: read
    steps:
      - name: Set image creation time
        id: created
        run: echo "value=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Build image
        uses: docker/build-push-action@v5.4.0
        with:
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ needs.metadata.outputs.created }}
            GOOGLE_CHROME_VERSION=${{ env.GOOGLE_CHROME_VERSION }}
          context: .
          file: docker/chrome/Dockerfile
          load: true
          platforms: ${{ matrix.platform }}
          tags: karakeep-chrome:build-check

  publish-architectures:
    name: Publish ${{ matrix.platform }}
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'karakeep-app/karakeep' &&
      github.ref == 'refs/heads/main'
    needs:
      - metadata
      - build
    environment: chrome-production
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            os: ubuntu-latest
          - platform: linux/arm64
            suffix: arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite the immutable tag
        env:
          VERSION_TAG: ${{ env.IMAGE }}:${{ env.GOOGLE_CHROME_VERSION }}-${{ env.IMAGE_REVISION }}
        run: |
          if docker buildx imagetools inspect "$VERSION_TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite published image $VERSION_TAG"
            exit 1
          fi

      - name: Build and publish architecture image
        uses: docker/build-push-action@v5.4.0
        with:
          build-args: |
            BUILD_REVISION=${{ github.sha }}
            BUILD_CREATED=${{ needs.metadata.outputs.created }}
            GOOGLE_CHROME_VERSION=${{ env.GOOGLE_CHROME_VERSION }}
          context: .
          file: docker/chrome/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE }}:${{ env.GOOGLE_CHROME_VERSION }}-${{ env.IMAGE_REVISION }}-${{ matrix.suffix }}

  publish-manifest:
    name: Publish multi-architecture manifest
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'karakeep-app/karakeep' &&
      github.ref == 'refs/heads/main'
    needs: publish-architectures
    environment: chrome-production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release manifests
        env:
          LATEST_TAG: ${{ env.IMAGE }}:latest
          RELEASE_TAG: ${{ env.IMAGE }}:release
          VERSION_TAG: ${{ env.IMAGE }}:${{ env.GOOGLE_CHROME_VERSION }}-${{ env.IMAGE_REVISION }}
        run: |
          docker buildx imagetools create \
            --tag "$VERSION_TAG" \
            --tag "$LATEST_TAG" \
            --tag "$RELEASE_TAG" \
            "$VERSION_TAG-amd64" \
            "$VERSION_TAG-arm64"

      - name: Inspect published manifests
        env:
          LATEST_TAG: ${{ env.IMAGE }}:latest
          RELEASE_TAG: ${{ env.IMAGE }}:release
          VERSION_TAG: ${{ env.IMAGE }}:${{ env.GOOGLE_CHROME_VERSION }}-${{ env.IMAGE_REVISION }}
        run: |
          docker buildx imagetools inspect "$VERSION_TAG"
          docker buildx imagetools inspect "$LATEST_TAG"
          docker buildx imagetools inspect "$RELEASE_TAG"
