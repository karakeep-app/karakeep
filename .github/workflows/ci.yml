name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# You can leverage Vercel Remote Caching with Turbo to speed up your builds
env:
  FORCE_COLOR: 3

jobs:
  actions-lock:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: Verify actions.lock
        run: gh actions-lock --verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Lint
        run: pnpm lint && pnpm exec sherif

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Format
        run: pnpm format

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Typecheck
        run: pnpm typecheck
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Shared Package Tests
        working-directory: packages/shared
        run: pnpm test

      - name: TRPC Tests
        working-directory: packages/trpc
        run: pnpm test

      - name: Workers Tests
        working-directory: apps/workers
        run: pnpm test

      - name: Web Tests
        working-directory: apps/web
        run: pnpm test

      - name: API Tests
        working-directory: packages/api
        run: pnpm test

      - name: Shared Server Tests
        working-directory: packages/shared-server
        run: pnpm test

      - name: MCP Tests
        working-directory: apps/mcp
        run: pnpm test

      - name: Mobile Tests
        working-directory: apps/mobile
        run: pnpm test

      # - name: Plugins Tests
      #   working-directory: packages/plugins
      #   run: pnpm test

      - name: Install Playwright Chromium
        working-directory: packages/e2e_tests
        run: pnpm exec playwright install --with-deps chromium

      # The default docker driver can't import the registry build cache that
      # the e2e docker-compose file uses, so build with a buildx builder.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: E2E Tests
        working-directory: packages/e2e_tests
        run: pnpm test

      - name: Upload Docker Logs
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: e2e-docker-logs-${{ github.sha }}-${{ github.run_attempt }}
          path: packages/e2e_tests/setup/docker-logs/
          retention-days: 7
  open-api-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.3.1
        with:
          persist-credentials: false

      - name: Setup
        uses: $/tooling/github/setup

      - name: Regenerate OpenAPI spec
        working-directory: packages/open-api
        run: pnpm run generate

      - name: Check for changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "Error: Generated files are not up to date!"
            echo "The following files have changes:"
            git status --porcelain
            echo ""
            echo "Please regenerate the files locally with (pnpm run generate) and commit the changes."
            git diff
            exit 1
          else
            echo "✅ Generated files are up to date!"
          fi
