server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /redirect-to-loopback {
        return 302 http://127.0.0.1:80/hello.html;
    }

    # Sends the headers right away, then the body at 1 byte/s: a banner host
    # that never finishes the download.
    location = /slow-banner.png {
        limit_rate 1;
        alias /usr/share/nginx/html/image.png;
    }

    location /fixtures/ {
        alias /usr/share/nginx/fixtures/;
    }

    location / {
        try_files $uri =404;
    }
}
