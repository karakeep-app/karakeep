server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /redirect-to-loopback {
        return 302 http://127.0.0.1:80/hello.html;
    }

    # Once the source fixture is removed, probes see an asset while the
    # subsequent download receives the missing-page status.
    location ~ ^/missing-pdf-404-(?<fixture>.+)$ {
        try_files /$fixture @missing_pdf_404;
    }
    location ~ ^/missing-pdf-410-(?<fixture>.+)$ {
        try_files /$fixture @missing_pdf_410;
    }
    location ~ ^/missing-image-404-(?<fixture>.+)$ {
        try_files /$fixture @missing_image_404;
    }
    location ~ ^/missing-image-410-(?<fixture>.+)$ {
        try_files /$fixture @missing_image_410;
    }
    location @missing_pdf_404 {
        error_page 418 = @pdf_probe;
        if ($http_user_agent = "karakeep-e2e-probe") { return 418; }
        return 404;
    }
    location @missing_pdf_410 {
        error_page 418 = @pdf_probe;
        if ($http_user_agent = "karakeep-e2e-probe") { return 418; }
        return 410;
    }
    location @missing_image_404 {
        error_page 418 = @image_probe;
        if ($http_user_agent = "karakeep-e2e-probe") { return 418; }
        return 404;
    }
    location @missing_image_410 {
        error_page 418 = @image_probe;
        if ($http_user_agent = "karakeep-e2e-probe") { return 418; }
        return 410;
    }
    location @pdf_probe {
        rewrite ^ /probe.pdf last;
    }
    location @image_probe {
        rewrite ^ /image.png last;
    }

    # The crawler regression tests create and remove unique fixture files.
    # This route returns 410 when the corresponding file has been removed.
    location ~ ^/gone-(.+)$ {
        try_files /$1 =410;
    }

    location / {
        try_files $uri =404;
    }
}
